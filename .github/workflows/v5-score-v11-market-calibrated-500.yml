name: V5-SCORE v1.1 market calibrated frozen 500

on:
  workflow_run:
    workflows: ["V5-SCORE v1.1 market coverage audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run paired frozen-500 experiment
        run: python data_pipeline/v5_score_v11_market_calibrated_500.py
      - name: Commit experiment outputs
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model_validation/V5-SCORE_v1.1_vs_v1.0_500.csv model_validation/V5-SCORE_v1.1_vs_v1.0_500.json model_validation/V5-SCORE_v1.1_matrix_change_500.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "validate: V5-SCORE v1.1 market-calibrated frozen 500"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
