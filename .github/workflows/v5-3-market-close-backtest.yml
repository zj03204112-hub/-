name: V5.3 Nations League retrospective, tail ablation and direction calibration

on:
  push:
    branches:
      - experiment/v5.3-direct-matrix-repair-2026-11-16
    paths:
      - "model_validation/backtest_v5_3_market_close.py"
      - "model_validation/ablation_v5_3_tail.py"
      - "model_validation/joint_direction_matrix_validation_v5_3.py"
      - "model_validation/fixtures/v5_3_unl_20261114_15.csv"
      - "model_validation/v5_2_market_lambda.py"
      - "model_validation/v5_3_direct_matrix_repair.py"
      - ".github/workflows/v5-3-market-close-backtest.yml"
  pull_request:
    paths:
      - "model_validation/backtest_v5_3_market_close.py"
      - "model_validation/ablation_v5_3_tail.py"
      - "model_validation/joint_direction_matrix_validation_v5_3.py"
      - "model_validation/fixtures/v5_3_unl_20261114_15.csv"
      - "model_validation/v5_2_market_lambda.py"
      - "model_validation/v5_3_direct_matrix_repair.py"
      - ".github/workflows/v5-3-market-close-backtest.yml"

jobs:
  replay-and-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run sourced 16-match V5.3 close-odds replay
        run: python -m model_validation.backtest_v5_3_market_close
      - name: Run fixed-weight V5.3 tail ablations
        run: python -m model_validation.ablation_v5_3_tail
      - name: Run joint direction and score-matrix sensitivity
        run: python -m model_validation.joint_direction_matrix_validation_v5_3
