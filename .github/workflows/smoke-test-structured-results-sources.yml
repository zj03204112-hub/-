name: Structured J1 and K League source smoke test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v5.2-classification-data-audit
    paths:
      - 'data_pipeline/smoke_test_structured_results_sources.py'
      - '.github/workflows/smoke-test-structured-results-sources.yml'
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2-classification-data-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas lxml requests beautifulsoup4
      - name: Run structured sample checks
        run: python data_pipeline/smoke_test_structured_results_sources.py
      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-j1-kleague-smoke-test
          path: data/sample_2026_300/structured_source_smoke_test.json
          if-no-files-found: warn
          retention-days: 30
