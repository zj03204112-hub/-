name: V4 probability source draw diagnostic 500

on:
  push:
    paths:
      - 'data_pipeline/v4_probability_source_draw_diagnostic_500.py'
      - 'data_pipeline/compare_models.py'
      - 'model_validation/500_match_to_db_match_id_mapping.csv'
      - 'football_model_database.sqlite'
      - '.github/workflows/v4-probability-source-draw-diagnostic-500.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run probability source diagnostic
        run: python data_pipeline/v4_probability_source_draw_diagnostic_500.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v4-probability-source-draw-diagnostic-500
          path: |
            model_validation/v4_draw_probability_matrix_diagnostic_500.json
            model_validation/v4_draw_probability_matrix_diagnostic_500.csv

      - name: Commit diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_validation/v4_draw_probability_matrix_diagnostic_500.json model_validation/v4_draw_probability_matrix_diagnostic_500.csv
          git diff --cached --quiet || git commit -m "Record V4 draw probability matrix diagnostic 500"
          git push
