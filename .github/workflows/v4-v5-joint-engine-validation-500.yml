name: V4 V5 joint engine validation (frozen 500)
on:
  push:
    paths:
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/v4_v5_result_calibration_experiment.py"
      - "data_pipeline/v4_v5_correct_win_loss_common_causes_500.py"
      - ".github/workflows/v4-v5-joint-engine-validation-500.yml"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - "data_pipeline/compare_models.py"
  pull_request:
    paths:
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/v4_v5_result_calibration_experiment.py"
      - ".github/workflows/v4-v5-joint-engine-validation-500.yml"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - "data_pipeline/compare_models.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-v5-joint-engine-validation-500
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run leakage-aware V4/V5/joint validation
        run: python data_pipeline/v4_v5_joint_engine_validation_500.py
      - name: Run H/D/A calibration experiment
        run: python data_pipeline/v4_v5_result_calibration_experiment.py
      - name: Run correct win/loss and missed-draw diagnosis
        run: python data_pipeline/v4_v5_correct_win_loss_common_causes_500.py
      - name: Print calibration summary
        run: cat model_validation/v4_v5_result_calibration_experiment.json
      - name: Print correct win/loss diagnosis
        run: cat model_validation/v4_v5_correct_win_loss_common_causes_500.json
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: v4-v5-result-accuracy-experiment
          path: |
            model_validation/v4_v5_joint_walkforward_500.csv
            model_validation/v4_v5_joint_walkforward_500_summary.json
            model_validation/v4_v5_result_calibration_experiment.csv
            model_validation/v4_v5_result_calibration_experiment.json
            model_validation/v4_v5_correct_win_loss_common_causes_500.csv
            model_validation/v4_v5_correct_win_loss_common_causes_500.json
