name: Football Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Initialize database\n        run: |\n          if [ ! -f football_model_database.sqlite ]; then\n            sqlite3 football_model_database.sqlite < database/football_model_database.sql\n          fi\n
      - name: Run historical data collector
        run: python data_pipeline/build_football_db.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database data || true
          git diff --cached --quiet || git commit -m "chore: sync football data"
          git push
