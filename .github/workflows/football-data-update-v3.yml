name: Football model data update

on:
  push:
    paths-ignore:
      - "data/**"
      - "football_model_database.sqlite"
      - "data/auto_results/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: football-model-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests lxml

      - name: Initialize database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path("football_model_database.sqlite")
          schema = Path("database/football_model_database.sql")
          if not db.exists():
              con = sqlite3.connect(db)
              con.executescript(schema.read_text(encoding="utf-8"))
              con.close()
          PY

      - name: Collect European league results
        run: python data_pipeline/build_football_db.py

      - name: Fetch official J1 feed
        run: python scripts/fetch_current_season.py

      - name: Collect J1 and K League 1
        run: python data_pipeline/collect_public_asia.py

      - name: Validate database
        run: python scripts/validate_database.py

      - name: Commit generated database
        run: |
          set -e
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python data_pipeline/build_football_db.py
            python scripts/fetch_current_season.py
            python data_pipeline/collect_public_asia.py
            python scripts/validate_database.py
            git add football_model_database.sqlite data/validation_report.json
            if git diff --cached --quiet; then
              echo "No generated database changes."
              exit 0
            fi
            git commit -m "auto: update football model database (attempt $attempt)"
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected; retrying from latest main."
          done
          exit 1
