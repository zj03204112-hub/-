name: Football player data verification
# trigger: player-data bounded validation

on:
  push:
    paths-ignore:
      - "data/**"
      - "football_model_database.sqlite"
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

concurrency:
  group: football-player-data-verification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  player_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests lxml curl_cffi
      - name: Migrate player data schema
        run: python scripts/migrate_player_schema.py
      - name: Inspect existing match base
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect("football_model_database.sqlite")
          m=con.execute("SELECT COUNT(*) FROM matches").fetchone()[0]
          p=con.execute("SELECT COUNT(*) FROM player_match_stats").fetchone()[0]
          mm=con.execute("SELECT COUNT(DISTINCT match_id) FROM player_match_stats").fetchone()[0]
          print({"matches":m,"player_rows_before":p,"mapped_matches_before":mm})
          if m == 0:
              raise SystemExit("MATCH_BASE_EMPTY")
          PY
      - name: Test FotMob real player data (free source)
        env:
          FOTMOB_MAX_MATCHES: "10"
        run: python data_pipeline/collect_fotmob_player_data.py
        timeout-minutes: 45
        continue-on-error: false
      - name: Verify player data layer
        run: |
          python - <<'PY'
          import sqlite3, sys, json
          con=sqlite3.connect("football_model_database.sqlite")
          rows=con.execute("SELECT COUNT(*) FROM player_match_stats").fetchone()[0]
          matches=con.execute("SELECT COUNT(DISTINCT match_id) FROM player_match_stats").fetchone()[0]
          sources=con.execute("SELECT data_source,COUNT(*) FROM player_match_stats GROUP BY data_source ORDER BY COUNT(*) DESC").fetchall()
          sides=con.execute("SELECT team_side,COUNT(*) FROM player_match_stats GROUP BY team_side").fetchall()
          mapped_events=con.execute("SELECT COUNT(*) FROM provider_event_map").fetchone()[0]
          print(json.dumps({"player_rows":rows,"mapped_matches":matches,"sources":sources,"team_sides":sides,"provider_event_map_rows":mapped_events},ensure_ascii=False))
          con.close()
          if rows == 0 or matches == 0:
              print("PLAYER_DATA_LAYER_EMPTY")
              sys.exit(1)
          PY
      - name: Commit player data database
        if: success()
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_model_database.sqlite
          if git diff --cached --quiet; then
            echo "No player database changes."
            exit 0
          fi
          git commit -m "auto: populate and verify player data"
          git push origin HEAD:main
