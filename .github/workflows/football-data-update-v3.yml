name: Football model data update

on:
  push:
    paths-ignore:
      - "data/**"
      - "football_model_database.sqlite"
      - "data/auto_results/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: football-model-data-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests lxml

      - name: Initialize database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path("football_model_database.sqlite")
          schema = Path("database/football_model_database.sql")
          if not db.exists():
              con = sqlite3.connect(db)
              con.executescript(schema.read_text(encoding="utf-8"))
              con.close()
          PY

      - name: Collect European league results
        run: python data_pipeline/build_football_db.py

      - name: Fetch official J1 feed
        run: python scripts/fetch_current_season.py

      - name: Collect J1 and K League 1
        run: python data_pipeline/collect_public_asia.py

      - name: Collect Sporttery historical handicap markets
        run: python data_pipeline/collect_sporttery_history.py
        continue-on-error: true

      - name: Build leakage-safe model features
        run: python data_pipeline/build_features.py

      - name: Build T-12h baseline predictions
        run: python data_pipeline/build_baseline_predictions.py

      - name: Validate database
        run: python scripts/validate_database.py

      - name: Commit generated database
        run: |
          set -e
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_model_database.sqlite data/validation_report.json data/baseline_backtest.json
          if git diff --cached --quiet; then
            echo "No generated database changes."
            exit 0
          fi
          git commit -m "auto: update football model database"
          git push origin HEAD:main
