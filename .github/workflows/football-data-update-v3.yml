name: Football player data verification
# trigger: player-data bounded validation

on:
  push:
    paths-ignore:
      - "data/**"
      - "football_model_database.sqlite"
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

concurrency:
  group: football-player-data-verification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  player_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests lxml curl_cffi
      - name: Migrate player data schema
        run: python scripts/migrate_player_schema.py
      - name: Inspect existing match base
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect("football_model_database.sqlite")
          m=con.execute("SELECT COUNT(*) FROM matches").fetchone()[0]
          p=con.execute("SELECT COUNT(*) FROM player_match_stats").fetchone()[0]
          mm=con.execute("SELECT COUNT(DISTINCT match_id) FROM player_match_stats").fetchone()[0]
          print({"matches":m,"player_rows_before":p,"mapped_matches_before":mm})
          if m == 0:
              raise SystemExit("MATCH_BASE_EMPTY")
          PY
      - name: Reset bounded FotMob validation rows
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect("football_model_database.sqlite")
          con.execute("DELETE FROM player_match_stats WHERE data_source='FotMob public matchDetails'")
          con.execute("DELETE FROM provider_event_map WHERE provider='fotmob'")
          con.commit()
          print("RESET_FOTMOB_VALIDATION_ROWS")
          con.close()
          PY
      - name: Test FotMob real player data (free source)
        env:
          FOTMOB_MAX_MATCHES: "700"
        run: python data_pipeline/collect_fotmob_player_data.py
        timeout-minutes: 90
        continue-on-error: false
      - name: Verify player data layer
        run: |
          python - <<'PY'
          import sqlite3, sys, json
          con=sqlite3.connect("football_model_database.sqlite")
          rows=con.execute("SELECT COUNT(*) FROM player_match_stats").fetchone()[0]
          matches=con.execute("SELECT COUNT(DISTINCT match_id) FROM player_match_stats").fetchone()[0]
          sources=con.execute("SELECT data_source,COUNT(*) FROM player_match_stats GROUP BY data_source ORDER BY COUNT(*) DESC").fetchall()
          sides=con.execute("SELECT team_side,COUNT(*) FROM player_match_stats GROUP BY team_side").fetchall()
          mapped_events=con.execute("SELECT COUNT(*) FROM provider_event_map").fetchone()[0]
          print(json.dumps({"player_rows":rows,"mapped_matches":matches,"sources":sources,"team_sides":sides,"provider_event_map_rows":mapped_events},ensure_ascii=False))
          con.close()
          if rows == 0 or matches == 0:
              print("PLAYER_DATA_LAYER_EMPTY")
              sys.exit(1)
          PY
      - name: Validate player data quality
        run: |
          python - <<'PY'
          import sqlite3, sys, json
          con=sqlite3.connect("football_model_database.sqlite")
          q=lambda s: con.execute(s).fetchone()[0]
          rows=q("SELECT COUNT(*) FROM player_match_stats")
          matches=q("SELECT COUNT(DISTINCT match_id) FROM player_match_stats")
          players=q("SELECT COUNT(DISTINCT player_id) FROM player_match_stats")
          played=q("SELECT COUNT(*) FROM player_match_stats WHERE minutes_played>0")
          rating_total=q("SELECT COUNT(*) FROM player_match_stats WHERE rating IS NOT NULL")
          played_rating=q("SELECT COUNT(*) FROM player_match_stats WHERE minutes_played>0 AND rating IS NOT NULL")
          rating_bad=q("SELECT COUNT(*) FROM player_match_stats WHERE rating IS NOT NULL AND (rating<0 OR rating>10)")
          minutes_bad=q("SELECT COUNT(*) FROM player_match_stats WHERE minutes_played<0 OR minutes_played>130")
          numeric_bad=q("""SELECT COUNT(*) FROM player_match_stats
            WHERE goals<0 OR assists<0 OR xg<0 OR xa<0 OR shots<0 OR key_passes<0
               OR tackles<0 OR interceptions<0 OR clearances<0""")
          duplicate_groups=q("""SELECT COUNT(*) FROM (
            SELECT match_id,team_side,player_id,COUNT(*) c
            FROM player_match_stats GROUP BY match_id,team_side,player_id HAVING c>1
          )""")
          bad_side=q("SELECT COUNT(*) FROM player_match_stats WHERE team_side NOT IN ('home','away')")
          source_rows=con.execute("SELECT data_source,COUNT(*) FROM player_match_stats GROUP BY data_source").fetchall()
          side_rows=con.execute("SELECT team_side,COUNT(*) FROM player_match_stats GROUP BY team_side").fetchall()
          map_rows=q("SELECT COUNT(DISTINCT match_id) FROM provider_event_map WHERE provider='fotmob'")
          map_detail=con.execute("SELECT match_id,COUNT(*) AS provider_rows,MIN(event_id),MAX(event_id) FROM provider_event_map WHERE provider='fotmob' GROUP BY match_id ORDER BY match_id").fetchall()
          player_match_detail=con.execute("SELECT match_id,COUNT(*) FROM player_match_stats GROUP BY match_id ORDER BY match_id").fetchall()
          print(json.dumps({"map_detail":map_detail,"player_match_detail":player_match_detail},ensure_ascii=False))
          metrics={
            "rows":rows,"matches":matches,"distinct_players":players,"played_rows":played,
            "rating_nonnull":rating_total,"rating_nonnull_rate":round(rating_total/rows,4) if rows else 0,
            "played_rating_nonnull":played_rating,"played_rating_rate":round(played_rating/played,4) if played else 0,
            "rating_bad":rating_bad,"minutes_bad":minutes_bad,"numeric_bad":numeric_bad,
            "duplicate_groups":duplicate_groups,"bad_team_side":bad_side,
            "fotmob_mapped_matches":map_rows,"sources":source_rows,"team_sides":side_rows
          }
          print(json.dumps(metrics,ensure_ascii=False))
          con.close()
          bad=[]
          if rows == 0 or matches == 0: bad.append("empty")
          if duplicate_groups or bad_side or rating_bad or minutes_bad or numeric_bad: bad.append("invalid_values")
          if played == 0: bad.append("no_played_players")
          if played and played_rating < played*0.60: bad.append("played_rating_coverage_low")
          if map_rows < matches: bad.append("provider_mapping_incomplete")
          if bad:
              print("PLAYER_DATA_QUALITY_FAILED:"+",".join(bad))
              sys.exit(1)
          print("PLAYER_DATA_QUALITY_PASS")
          PY
      - name: Rebuild T-12h lineup projection
        run: |
          python data_pipeline/build_lineup_projection.py

      - name: Run full model validation
        run: |
          python data_pipeline/compare_models.py
          python - <<'PY'
          import json
          p="data/model_comparison.json"
          d=json.load(open(p,encoding="utf-8"))
          print(json.dumps(d,ensure_ascii=False))
          PY

      - name: Validate Asian handicap settlement semantics
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"data_pipeline")
          from backtest_player_10 import asian_settlement
          # diff = selected(home) goals - opponent goals; line is the
          # handicap assigned to the selected home side.
          # Quarter lines split across the two adjacent atomic lines.
          cases = [
            # -0.75 = (-0.5,-1.0)
            (1,-0.75,"H_half"), (2,-0.75,"H_full"), (0,-0.75,"A_full"),
            # +0.75 = (+0.5,+1.0)
            (0,0.75,"H_full"), (-1,0.75,"A_half"), (-2,0.75,"A_full"),
            # -1.25 = (-1.0,-1.5)
            (2,-1.25,"H_full"), (3,-1.25,"H_full"), (1,-1.25,"A_half"),
            # +1.25 = (+1.0,+1.5)
            (1,1.25,"H_full"), (0,1.25,"H_full"), (-1,1.25,"H_half"),
            (-2,1.25,"A_full"),
            # whole-line push
            (1,-1.0,"D"), (0,0.0,"D")
          ]
          for diff,line,expected in cases:
              got=asian_settlement(diff,line)
              print({"diff":diff,"line":line,"got":got,"expected":expected})
              assert got == expected, (diff,line,got,expected)
          print("ASIAN_HANDICAP_SEMANTICS_PASS")
          PY

      - name: Run 500-match player-layer backtest
        env:
          BACKTEST_N: "500"
          BACKTEST_OUT: "data/player_backtest_500.json"
        run: |
          python data_pipeline/backtest_player_10.py

      - name: Calibrate player correction coefficient (train 350 / holdout 150)
        env:
          PLAYER_CALIBRATION_N: "500"
          PLAYER_CALIBRATION_TRAIN_N: "350"
          PLAYER_CALIBRATION_OUT: "data/player_layer_calibration_500.json"
        run: |
          python data_pipeline/calibrate_player_layer.py

      - name: Commit player data database
        if: success()
        run: |
          set -e
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_model_database.sqlite data/player_backtest_500.json data/player_layer_calibration_500.json
          if git diff --cached --quiet; then
            echo "No player database changes."
            exit 0
          fi
          git commit -m "auto: populate and verify player data"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "PLAYER_DATA_PUSH_OK attempt=$attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "PLAYER_DATA_PUSH_RETRY attempt=$attempt"
            sleep 3
          done
          echo "PLAYER_DATA_PUSH_FAILED"
          exit 1

