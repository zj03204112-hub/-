name: V4 matrix draw structure 500

on:
  push:
    paths:
      - 'data_pipeline/v4_matrix_draw_structure_500.py'
      - 'data_pipeline/compare_models.py'
      - 'model_validation/500_match_to_db_match_id_mapping.csv'
      - 'football_model_database.sqlite'
      - '.github/workflows/v4-matrix-draw-structure-500.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python data_pipeline/v4_matrix_draw_structure_500.py
      - name: Print summary to Actions log
        if: success()
        run: |
          echo "===== V4 MATRIX DRAW STRUCTURE 500 SUMMARY ====="
          cat model_validation/v4_matrix_draw_structure_500_summary.json
          echo "===== END SUMMARY ====="
      - name: Persist summary to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_validation/v4_matrix_draw_structure_500_summary.json
          if git diff --cached --quiet; then
            echo "SUMMARY_UNCHANGED"
          else
            git commit -m "Persist V4 matrix draw structure 500 summary"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v4-matrix-draw-structure-500
          path: |
            model_validation/v4_matrix_draw_structure_500.csv
            model_validation/v4_matrix_draw_structure_500_summary.json
