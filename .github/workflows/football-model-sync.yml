name: Football Model Data Sync

on:
  push:
    paths:
      - 'data_pipeline/build_football_db.py'
      - 'data_pipeline/collect_public_asia.py'
      - 'data_pipeline/repair_kleague_dates.py'
      - 'scripts/validate_database.py'
      - 'scripts/audit_out_of_scope_matches.py'
      - '.github/workflows/football-model-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write

concurrency:
  group: football-model-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas lxml

      - name: Initialize database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path("football_model_database.sqlite")
          schema = Path("database/football_model_database.sql")
          if not db.exists():
              con = sqlite3.connect(db)
              con.executescript(schema.read_text(encoding="utf-8"))
              con.close()
          PY

      - name: Collect five major European leagues
        run: python data_pipeline/build_football_db.py

      - name: Rebuild K League 1 dates from public schedule source
        run: python data_pipeline/repair_kleague_dates.py

      - name: Collect K League 1 and J1
        run: python data_pipeline/collect_public_asia.py

      - name: Audit out-of-scope fixtures before validation
        run: python scripts/audit_out_of_scope_matches.py

      - name: Validate database
        run: python scripts/validate_database.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football_model_database.sqlite data/validation_report.json data/auto_results/K_League_1_2026_27_dated.csv data/auto_results/K_League_1_undated_quarantine.csv data/out_of_scope_audit.json
          git diff --cached --quiet || git commit -m "chore: sync football model database"
          git push
