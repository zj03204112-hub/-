name: Probe public historical football result sources
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v5.2-classification-data-audit
    paths:
      - 'data_pipeline/probe_public_football_result_sources.py'
      - '.github/workflows/probe-public-football-result-sources.yml'
permissions:
  contents: read
jobs:
  probe-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2-classification-data-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --upgrade requests
      - name: Probe a small J1 and K League historical sample
        run: python data_pipeline/probe_public_football_result_sources.py
      - name: Upload source probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-football-source-probe
          path: data/sample_2026_300/public_source_probe.json
          if-no-files-found: warn
          retention-days: 30
