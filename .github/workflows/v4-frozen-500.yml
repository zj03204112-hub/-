name: Frozen V4 500 error decomposition

on:
  push:
    paths:
      - "data_pipeline/backtest_v4_frozen_500.py"
      - "model_validation/500_match_base_batch01.csv"
      - "data_pipeline/compare_models.py"
      - "football_model_database.sqlite"
      - ".github/workflows/v4-frozen-500.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay exact frozen 500 with V4
        run: python data_pipeline/backtest_v4_frozen_500.py
      - name: Decompose 8 error dimensions
        run: python data_pipeline/analyze_v4_frozen_500_errors.py
      - name: Commit frozen predictions and diagnosis
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model_validation/500_match_V4_frozen_predictions.csv model_validation/500_match_V4_error_diagnosis.md model_validation/500_match_V4_error_diagnosis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "validate: freeze V4 500 predictions and error diagnosis"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
