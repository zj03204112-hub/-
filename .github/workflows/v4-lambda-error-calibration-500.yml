name: V4 lambda error diagnosis and train-only calibration

on:
  push:
    branches: [experiment/lambda-error-calibration-20261010]
    paths:
      - "data_pipeline/v4_lambda_error_calibration_train_only_500.py"
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/compare_models.py"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - ".github/workflows/v4-lambda-error-calibration-500.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run frozen 500 lambda diagnosis
        run: python data_pipeline/v4_lambda_error_calibration_train_only_500.py
      - name: Print summary
        run: cat model_validation/v4_lambda_error_calibration_train_only_500_summary.json
      - name: Upload detailed output
        uses: actions/upload-artifact@v4
        with:
          name: v4-lambda-error-calibration-train-only-500
          path: |
            model_validation/v4_lambda_error_calibration_train_only_500.csv
            model_validation/v4_lambda_error_calibration_train_only_500_summary.json
          if-no-files-found: error
      - name: Persist experiment output to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_validation/v4_lambda_error_calibration_train_only_500.csv model_validation/v4_lambda_error_calibration_train_only_500_summary.json
          git diff --cached --quiet || git commit -m "Record train-only V4 lambda calibration diagnosis"
          git push origin HEAD:experiment/lambda-error-calibration-20261010
