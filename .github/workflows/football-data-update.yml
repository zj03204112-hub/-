name: Football data update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Fetch current-season league results
        env:
          KLEAGUE_API_KEY: ${{ secrets.KLEAGUE_API_KEY }}
        run: python scripts/fetch_current_season.py
      - name: Commit updated data
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auto_results
          git diff --cached --quiet || git commit -m "auto: update current season results"
          git push
