name: V5.2 448 odds-assisted audit

on:
  push:
    branches:
      - feature/v5.2-classification-data-audit
    paths:
      - "data_pipeline/v52_448_odds_assisted_audit.py"
      - ".github/workflows/v52-448-odds-assisted-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odds_assisted_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.2-classification-data-audit
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install numpy scikit-learn
      - name: Compile audit
        run: python -m py_compile data_pipeline/v52_448_odds_assisted_audit.py
      - name: Run 448 odds-assisted retrospective audit
        run: python data_pipeline/v52_448_odds_assisted_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v52-448-odds-assisted-audit
          path: model_validation/v52_jincai_20260901_20261013/v52_448_odds_assisted_audit.json
          if-no-files-found: warn
