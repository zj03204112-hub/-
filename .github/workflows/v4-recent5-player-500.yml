name: V4 recent5 player frozen 500
on:
  workflow_dispatch:
  push:
    paths:
      - 'data_pipeline/v4_recent5_player_500.py'
      - 'model_validation/500_match_to_db_match_id_mapping.csv'
      - 'football_model_database.sqlite'
      - '.github/workflows/v4-recent5-player-500.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run recent5 + player frozen-500 validation
        run: python data_pipeline/v4_recent5_player_500.py
        timeout-minutes: 60
      - name: Print summary
        run: cat model_validation/v4_recent5_player_500_summary.json
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4-recent5-player-frozen-500
          path: |
            model_validation/v4_recent5_player_500.csv
            model_validation/v4_recent5_player_500_summary.json
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_validation/v4_recent5_player_500.csv model_validation/v4_recent5_player_500_summary.json
          git diff --cached --quiet || git commit -m "Persist recent5 plus player frozen-500 validation"
          git push
