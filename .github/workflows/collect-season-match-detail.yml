name: Collect season scores lineups and xG

on:
  push:
    branches:
      - audit/stable-match-id-mapping-20261101
    paths:
      - ".github/workflows/collect-season-match-detail.yml"
      - "data_pipeline/fetch_season_results_lineups_xg.py"
      - "data_pipeline/audit_j1_phase1.py"
  workflow_dispatch:
    inputs:
      league:
        description: League key
        required: true
        type: choice
        options:
          - premier-league
          - la-liga
          - bundesliga
          - serie-a
          - ligue-1
          - kleague1
          - j1
        default: premier-league
      season:
        description: Season start year (2025 = 2025-26, 2026 = 2026-27)
        required: true
        type: choice
        options:
          - "2025"
          - "2026"
        default: "2025"
permissions:
  contents: write

concurrency:
  group: season-detail-${{ inputs.league || (github.event_name == 'push' && 'j1') || 'premier-league' }}-${{ inputs.season || (github.event_name == 'push' && '2026') || '2025' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect season match details
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUE_KEY: ${{ inputs.league || (github.event_name == 'push' && 'j1') || 'premier-league' }}
          SEASON: ${{ inputs.season || (github.event_name == 'push' && '2026') || '2025' }}
          REQUEST_PAUSE_SECONDS: "0.35"
        run: python data_pipeline/fetch_season_results_lineups_xg.py

      - name: Run J1 phase-one quality audit
        if: ${{ (inputs.league == 'j1' && inputs.season == '2026') || github.event_name == 'push' }}
        run: python data_pipeline/audit_j1_phase1.py

      - name: Commit season dataset and audit
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/season_match_detail
          if git diff --cached --quiet; then
            echo "No new season data changes."
            exit 0
          fi
          git commit -m "data: collect ${{ inputs.league || 'premier-league' }} season ${{ inputs.season || '2025' }} match details"
          branch="${GITHUB_REF#refs/heads/}"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-match-detail-${{ inputs.league || (github.event_name == 'push' && 'j1') || 'premier-league' }}-${{ inputs.season || (github.event_name == 'push' && '2026') || '2025' }}
          path: data/season_match_detail/
          if-no-files-found: warn
          retention-days: 90
