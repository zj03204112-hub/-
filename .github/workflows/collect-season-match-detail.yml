name: Collect season scores lineups and xG

on:
  push:
    branches:
      - audit/stable-match-id-mapping-20261101
    paths:
      - ".github/workflows/collect-season-match-detail.yml"
      - "data_pipeline/fetch_season_results_lineups_xg.py"
      - "data_pipeline/audit_j1_phase1.py"
      - "data_pipeline/collect_j1_free_official_reports.py"
      - "data_pipeline/enrich_j1_player_ids_minutes.py"
      - "data_pipeline/collect_j1_free_xg.py"
      - "data_pipeline/collect_j1_team_season_xg.py"
      - "data_pipeline/aggregate_j1_covered_match_xg.py"
  workflow_dispatch:
    inputs:
      league:
        description: League key
        required: true
        type: choice
        options:
          - premier-league
          - la-liga
          - bundesliga
          - serie-a
          - ligue-1
          - kleague1
          - j1
        default: premier-league
      season:
        description: Season start year (2025 = 2025-26, 2026 = 2026-27)
        required: true
        type: choice
        options:
          - "2025"
          - "2026"
        default: "2025"
permissions:
  contents: write

concurrency:
  group: season-detail-${{ inputs.league || (github.event_name == 'push' && 'j1') || 'premier-league' }}-${{ inputs.season || (github.event_name == 'push' && '2026') || '2025' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free collector dependencies
        run: pip install requests beautifulsoup4

      - name: Collect J1 data from free official reports
        if: ${{ (github.event_name == 'push') || inputs.league == 'j1' }}
        run: python data_pipeline/collect_j1_free_official_reports.py

      - name: Enrich J1 player IDs and actual minutes from official profiles
        if: ${{ (github.event_name == 'push') || inputs.league == 'j1' }}
        run: python data_pipeline/enrich_j1_player_ids_minutes.py

      - name: Collect free public J1 match xG
        if: ${{ (github.event_name == 'push') || inputs.league == 'j1' }}
        run: python data_pipeline/collect_j1_free_xg.py

      - name: Collect free public J1 team-season xG and xGA
        if: ${{ (github.event_name == 'push') || inputs.league == 'j1' }}
        run: python data_pipeline/collect_j1_team_season_xg.py

      - name: Aggregate sourced xG and xGA for covered J1 matches
        if: ${{ (github.event_name == 'push') || inputs.league == 'j1' }}
        run: python data_pipeline/aggregate_j1_covered_match_xg.py

      - name: Collect other leagues from configured provider
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.league != 'j1' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUE_KEY: ${{ inputs.league }}
          SEASON: ${{ inputs.season }}
          REQUEST_PAUSE_SECONDS: "0.35"
        run: python data_pipeline/fetch_season_results_lineups_xg.py

      - name: Commit collected data and audit
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/season_match_detail
          if git diff --cached --quiet; then
            echo "No new season data changes."
            exit 0
          fi
          git commit -m "data: collect free official J1 lineup and substitution records"
          branch="${GITHUB_REF#refs/heads/}"
          git fetch origin "$branch"
          if ! git rebase "origin/$branch"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$conflicts" ]; then
              while IFS= read -r conflict_file; do
                case "$conflict_file" in
                  data/season_match_detail/j1_2026_free_official_audit.json|data/season_match_detail/j1_2026_players_free_official.csv|data/season_match_detail/j1_2026_substitutions_free_official.csv|data/season_match_detail/j1_2026_match_xg_free.csv|data/season_match_detail/j1_2026_match_xg_free_audit.json|data/season_match_detail/j1_2026_match_xg_legacy_unverified.csv|data/season_match_detail/j1_2026_team_season_xg_free.csv|data/season_match_detail/j1_2026_team_season_xg_free_audit.json|data/season_match_detail/j1_2026_team_xg_from_covered_matches.csv|data/season_match_detail/j1_2026_team_xg_from_covered_matches_audit.json)
                    # These are generated collector outputs; prefer this run's regenerated data.
                    git checkout --theirs -- "$conflict_file"
                    git add "$conflict_file"
                    ;;
                  *)
                    git rebase --abort || true
                    echo "Unexpected rebase conflict: $conflict_file"
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort || true
              echo "Rebase failed without a resolvable generated-file conflict."
              exit 1
            fi
          fi
          git push origin "HEAD:$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-match-detail-free-j1
          path: data/season_match_detail/
          if-no-files-found: warn
          retention-days: 90
