name: Backfill historical odds for frozen 448 matches
on:
  push:
    branches:
      - feature/v5.2-classification-data-audit
    paths:
      - "data_pipeline/backfill_v52_448_historical_odds.py"
      - ".github/workflows/v52-448-historical-odds-backfill.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2-classification-data-audit
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Compile backfill
        run: python -m py_compile data_pipeline/backfill_v52_448_historical_odds.py
      - name: Collect official historical Sporttery odds
        run: python data_pipeline/backfill_v52_448_historical_odds.py
      - name: Upload historical odds and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v52-448-historical-odds-backfill
          path: |
            model_validation/v52_jincai_20260901_20261013/v52_448_sporttery_match_mapping.csv
            model_validation/v52_jincai_20260901_20261013/v52_448_historical_odds.csv
            model_validation/v52_jincai_20260901_20261013/v52_448_historical_odds_backfill_report.json
          if-no-files-found: warn
