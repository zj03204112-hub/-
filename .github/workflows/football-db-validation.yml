name: Football Database Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "5 3 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize database
        run: |
          if [ ! -f football_model_database.sqlite ]; then
            sqlite3 football_model_database.sqlite < database/football_model_database.sql
          fi
      - name: Validate
        run: python scripts/validate_database.py
      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation_report.json || true
          git diff --cached --quiet || git commit -m "chore: update database validation report"
          git push
