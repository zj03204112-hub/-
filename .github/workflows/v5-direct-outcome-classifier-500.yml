name: V5.1 direct outcome classifier experiment
on:
  push:
    branches:
      - experiment/v5-direct-outcome-classifier-20261009
    paths:
      - "data_pipeline/v5_1_direct_outcome_classifier_500.py"
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/compare_models.py"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - ".github/workflows/v5-direct-outcome-classifier-500.yml"
  pull_request:
    paths:
      - "data_pipeline/v5_1_direct_outcome_classifier_500.py"
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/compare_models.py"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - ".github/workflows/v5-direct-outcome-classifier-500.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-direct-outcome-classifier-500
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Run direct H/D/A classifier on frozen 500
        run: python data_pipeline/v5_1_direct_outcome_classifier_500.py
      - name: Print experiment summary
        run: cat model_validation/v5_1_direct_outcome_classifier_500_summary.json
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-1-direct-outcome-classifier-500
          path: |
            model_validation/v5_1_direct_outcome_classifier_500_summary.json
            model_validation/v5_1_direct_outcome_classifier_500_predictions.csv
            model_validation/V5_1_DIRECT_OUTCOME_CLASSIFIER_EXPERIMENT_2026-10-09.md
