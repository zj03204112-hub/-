name: JC daily report 10-match validation

on:
  workflow_dispatch:
  push:
    paths:
      - "data_pipeline/backtest_jc_daily_report.py"
      - ".github/workflows/jc-daily-report-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Run 10-match external-source validation
        env:
          SITE_BACKTEST_N: "10"
          SITE_BACKTEST_OUT: "data/jc_daily_report_backtest_10.json"
        run: python data_pipeline/backtest_jc_daily_report.py
      - name: Commit result
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jc_daily_report_backtest_10.json
          if git diff --cached --quiet; then
            echo "No backtest output changes."
            exit 0
          fi
          git commit -m "auto: jc daily report 10-match validation"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
