name: Live football database audit

on:
  push:
    branches: [audit/live-database-inventory-20261010]
    paths:
      - "data_pipeline/audit_live_database.py"
      - ".github/workflows/live-database-audit.yml"
      - "football_model_database.sqlite"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run read-only database audit
        run: python data_pipeline/audit_live_database.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-database-audit
          path: |
            model_validation/database_audit/database_audit.md
            model_validation/database_audit/database_audit.json
            model_validation/database_audit/database_tables.csv
          if-no-files-found: warn
      - name: Persist audit report to branch
        if: always()
        run: |
          if [ -f model_validation/database_audit/database_audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add model_validation/database_audit/
            git diff --cached --quiet || git commit -m "Record live database audit report"
            git push origin HEAD:audit/live-database-inventory-20261010
          fi
