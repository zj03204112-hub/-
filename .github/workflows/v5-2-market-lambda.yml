name: V5.2 market-lambda unit tests

on:
  push:
    branches: [main]
    paths:
      - "model_validation/v5_2_market_lambda.py"
      - "tests/test_v5_2_market_lambda.py"
      - ".github/workflows/v5-2-market-lambda.yml"
  pull_request:
    branches: [main]
    paths:
      - "model_validation/v5_2_market_lambda.py"
      - "tests/test_v5_2_market_lambda.py"
      - ".github/workflows/v5-2-market-lambda.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V5.2 market-lambda tests
        run: python -m unittest tests/test_v5_2_market_lambda.py -v
