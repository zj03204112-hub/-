name: Handicap margin optimization

on:
  push:
    paths:
      - "data_pipeline/optimize_handicap_margin_model.py"
      - "data_pipeline/compare_models.py"
      - "football_model_database.sqlite"
      - ".github/workflows/handicap-margin-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas requests lxml curl_cffi
      - name: Run leakage-safe margin calibration experiment
        run: python data_pipeline/optimize_handicap_margin_model.py
      - name: Run formal 30-match model validation
        run: |
          HIST_LIMIT=30 MODEL_COMPARISON_OUT=data/model_comparison_30.json python data_pipeline/compare_models.py
      - name: Check formal 30-match validation result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/model_comparison_30.json",encoding="utf-8"))
          m=d["models"]
          print("30-match production validation [schema-check-v2]")
          for k in ("v1","v2","v3","v4"):
              print(k, m[k])
          if "chronological_holdout" in d:
              print("holdout", d["chronological_holdout"].get("models", {}))
          else:
              print("holdout: not present in this output; formal full-sample validation is complete")
          PY
      - name: Commit optimization result
        run: |
          set -e
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add data/handicap_margin_optimization.json data/model_comparison_30.json
          if git diff --cached --quiet; then
            echo "No optimization result changes."
            exit 0
          fi
          git commit -m "auto: update 30-match production validation"
          git push origin HEAD:main
