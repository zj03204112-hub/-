name: V4 hard90 decision layer 500
on:
  push:
    paths:
      - 'data_pipeline/v4_hard90_decision_layer.py'
      - 'data_pipeline/compare_models.py'
      - 'model_validation/500_match_to_db_match_id_mapping.csv'
      - 'football_model_database.sqlite'
      - '.github/workflows/v4-hard90-decision.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run hard90 decision experiment
        run: python data_pipeline/v4_hard90_decision_layer.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v4-hard90-decision-500
          path: model_validation/v4_hard90_decision_500.csv
