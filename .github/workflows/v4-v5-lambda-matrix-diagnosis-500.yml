name: V4 V5 lambda and score-matrix diagnosis (frozen 500)
on:
  push:
    paths:
      - "data_pipeline/v4_v5_lambda_matrix_diagnosis_500.py"
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/compare_models.py"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - ".github/workflows/v4-v5-lambda-matrix-diagnosis-500.yml"
  pull_request:
    paths:
      - "data_pipeline/v4_v5_lambda_matrix_diagnosis_500.py"
      - "data_pipeline/v4_v5_joint_engine_validation_500.py"
      - "data_pipeline/compare_models.py"
      - "model_validation/500_match_to_db_match_id_mapping.csv"
      - "football_model_database.sqlite"
      - ".github/workflows/v4-v5-lambda-matrix-diagnosis-500.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-v5-lambda-matrix-diagnosis-500
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose lambda generation and score matrix; test one module only
        run: python data_pipeline/v4_v5_lambda_matrix_diagnosis_500.py
      - name: Print diagnosis and experiment decision
        run: cat model_validation/v4_v5_lambda_matrix_diagnosis_500.json
      - name: Upload frozen-500 reports
        uses: actions/upload-artifact@v4
        with:
          name: v4-v5-lambda-matrix-diagnosis-500
          path: |
            model_validation/v4_v5_lambda_matrix_diagnosis_500.json
            model_validation/v4_v5_lambda_matrix_diagnosis_500.csv
