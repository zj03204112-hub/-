name: V4 draw probability calibration 500
on:
  push:
    paths:
      - 'data_pipeline/v4_draw_probability_calibration_500.py'
      - 'model_validation/500_match_to_db_match_id_mapping.csv'
      - 'football_model_database.sqlite'
      - '.github/workflows/v4-draw-probability-calibration-500.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run only draw calibration frozen-500 experiment
        run: python data_pipeline/v4_draw_probability_calibration_500.py
      - name: Print summary
        run: cat model_validation/v4_draw_probability_calibration_500_summary.json
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4-draw-probability-calibration-frozen-500
          path: |
            model_validation/v4_draw_probability_calibration_500.csv
            model_validation/v4_draw_probability_calibration_500_summary.json
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_validation/v4_draw_probability_calibration_500.csv model_validation/v4_draw_probability_calibration_500_summary.json
          git diff --cached --quiet || git commit -m "Validate V4 draw probability calibration on frozen 500"
          git push origin HEAD:main