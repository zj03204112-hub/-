name: API-Football backup (manual only)

on:
  workflow_dispatch:

# API-Football Free currently does not expose the 2026 season.
# Keep this workflow manual so it does not waste quota or create misleading
# "successful" scheduled runs with zero fixtures.

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - name: Fetch API-Football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_api_football.py

      - name: Commit changes
        run: |
          git config user.name "football-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/api_football
          git diff --cached --quiet || git commit -m "manual: update API-Football backup"
          git push
